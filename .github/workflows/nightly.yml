#
# Manual validation only, on an isolated CI branch that never merges into the product branches. The workflow is
# loaded from this branch, but every job checks out and proves the selected product commit. One complete official
# firmware gate per board avoids the toolchain-wide timeout without changing any build or resource policy.
name: Nightly

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published product commit to validate
        type: choice
        required: true
        options:
          - 11922518e8b03f1e18b32c5a336fb4d1baeff27f
          - 2008e4ca2f61fc58446f338c24bc2d1e71c8a899
          - e588d0e76b34f9ec444382ad56bdcc1c728a632c
          - 8769c7112ee84094057dd382b74b1764009be698
      boards:
        description: all, or comma-separated board IDs from the selected source registry
        type: string
        required: false
        default: all

permissions:
  contents: read
  packages: read

concurrency:
  group: p25-validation-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  BOARD_SELECTION: ${{ inputs.boards }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  WORKFLOW_REF: ${{ github.workflow_ref }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - name: Record the request before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/p25-source-proof"
          printf '%s\n' "source=$SOURCE_SHA" "workflow=$WORKFLOW_SHA" "workflow_ref=$WORKFLOW_REF" \
            "boards=$BOARD_SELECTION" > "$RUNNER_TEMP/p25-source-proof/request.txt"
      - name: Check out the exact product source
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Prove the source and discover the board matrix
        id: registry
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/p25-source-proof/head.txt"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/p25-source-proof/status.txt"
          test "$(cat "$RUNNER_TEMP/p25-source-proof/head.txt")" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test ! -s "$RUNNER_TEMP/p25-source-proof/status.txt"
          PY=$(tools/rfoundry_python.sh)
          "$PY" tools/boards.py json --for build --out "$RUNNER_TEMP/p25-source-proof/registry-build.json"
          "$PY" - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          proof = Path(os.environ["RUNNER_TEMP"]) / "p25-source-proof"
          registry = json.loads((proof / "registry-build.json").read_text())
          boards = registry["boards"]
          selection = os.environ["BOARD_SELECTION"].strip()
          if selection == "all":
              selected = sorted(boards)
          else:
              selected = [item.strip() for item in selection.split(",")]
              if not all(selected) or len(set(selected)) != len(selected):
                  raise SystemExit("boards must be all or distinct, nonempty comma-separated registry IDs")
              unknown = sorted(set(selected) - set(boards))
              if unknown:
                  raise SystemExit("unknown boards: %s; registry IDs: %s" % (", ".join(unknown), ", ".join(sorted(boards))))
              selected = sorted(selected)
          if not selected:
              raise SystemExit("the source registry selected no boards")
          include = []
          for board in selected:
              platform = boards[board]["platform"]
              toolchain = registry["platforms"][platform]["toolchain"]
              if not all(re.fullmatch(r"[a-z0-9][a-z0-9_-]*", value) for value in (board, toolchain)):
                  raise SystemExit("invalid board/toolchain ID in the source registry")
              include.append({"board": board, "toolchain": toolchain})
          git = lambda *args: subprocess.check_output(["git", *args], text=True).strip()
          record = {"requested_source": os.environ["SOURCE_SHA"], "head": git("rev-parse", "HEAD"),
                    "tree": git("rev-parse", "HEAD^{tree}"), "commit_time": git("show", "-s", "--format=%ct", "HEAD"),
                    "status": git("status", "--porcelain", "--untracked-files=all"),
                    "shallow": git("rev-parse", "--is-shallow-repository"),
                    "workflow_sha": os.environ["WORKFLOW_SHA"], "workflow_ref": os.environ["WORKFLOW_REF"],
                    "requested_boards": selection, "matrix": include}
          (proof / "source.json").write_text(json.dumps(record, indent=2) + "\n")
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + matrix + "\n")
          print(matrix)
          PY
      - name: Upload registry and source proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: registry-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p25-source-proof/
          if-no-files-found: error

  firmware:
    name: firmware (${{ matrix.board }}, ${{ matrix.toolchain }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      BOARD: ${{ matrix.board }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Record the request before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/p25-source-proof"
          printf '%s\n' "source=$SOURCE_SHA" "workflow=$WORKFLOW_SHA" "workflow_ref=$WORKFLOW_REF" \
            "board=$BOARD" "toolchain=$TOOLCHAIN" > "$RUNNER_TEMP/p25-source-proof/request.txt"
      - name: Check out the exact product source
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Prove the source and matrix selection
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/p25-source-proof/head.txt"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/p25-source-proof/status.txt"
          test "$(cat "$RUNNER_TEMP/p25-source-proof/head.txt")" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test ! -s "$RUNNER_TEMP/p25-source-proof/status.txt"
          PY=$(tools/rfoundry_python.sh)
          "$PY" tools/boards.py json --for build --out "$RUNNER_TEMP/p25-source-proof/registry-build.json"
          "$PY" - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          proof = Path(os.environ["RUNNER_TEMP"]) / "p25-source-proof"
          registry = json.loads((proof / "registry-build.json").read_text())
          board = registry["boards"][os.environ["BOARD"]]
          platform = board["platform"]
          assert registry["platforms"][platform]["toolchain"] == os.environ["TOOLCHAIN"]
          git = lambda *args: subprocess.check_output(["git", *args], text=True).strip()
          record = {"requested_source": os.environ["SOURCE_SHA"], "head": git("rev-parse", "HEAD"),
                    "tree": git("rev-parse", "HEAD^{tree}"), "commit_time": git("show", "-s", "--format=%ct", "HEAD"),
                    "status": git("status", "--porcelain", "--untracked-files=all"),
                    "shallow": git("rev-parse", "--is-shallow-repository"),
                    "workflow_sha": os.environ["WORKFLOW_SHA"], "workflow_ref": os.environ["WORKFLOW_REF"],
                    "board": os.environ["BOARD"], "platform": platform, "toolchain": os.environ["TOOLCHAIN"]}
          (proof / "source.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - name: third_party submodules
        run: |
          set -euo pipefail
          tools/checkout-submodules.sh 2>&1 | tee "$RUNNER_TEMP/p25-source-proof/submodules.log"
          git submodule status --recursive > "$RUNNER_TEMP/p25-source-proof/submodule-pins.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Toolchain (source platform.toml pin)
        id: tc
        uses: ./.github/actions/toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
          image: ${{ vars.RFOUNDRY_CSKY_IMAGE }}
      - name: Full official firmware gate for this board
        env:
          RUN: ${{ steps.tc.outputs.run }}
        run: |
          set -euo pipefail
          source_run() {
            if [ -n "$RUN" ]; then "$RUN" env GITHUB_SHA="$SOURCE_SHA" "$@"
            else env GITHUB_SHA="$SOURCE_SHA" "$@"; fi
          }
          # The Makefile takes identity/time from git HEAD. Also keep child process metadata on the product SHA.
          source_run make -s BOARD="$BOARD" print-vars \
            VARS='RFOUNDRY_VERSION RFOUNDRY_GIT_HEAD RFOUNDRY_GIT_DIRTY RFOUNDRY_GIT_TIME' \
            2>&1 | tee "$RUNNER_TEMP/p25-source-proof/build-metadata.log"
          grep -Fx "RFOUNDRY_VERSION=${SOURCE_SHA:0:8}" "$RUNNER_TEMP/p25-source-proof/build-metadata.log"
          grep -Fx 'RFOUNDRY_GIT_DIRTY=0' "$RUNNER_TEMP/p25-source-proof/build-metadata.log"
          set +e
          source_run tools/ci.sh --board "$BOARD" --steps firmware \
            2>&1 | tee "$RUNNER_TEMP/p25-source-proof/full-firmware.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          rc=${statuses[0]}
          if [ "${statuses[1]}" != 0 ]; then exit "${statuses[1]}"; fi
          if [ "$rc" = 3 ]; then
            echo '::error::the required toolchain/image is unavailable; a skipped firmware gate is a failure'
            exit 1
          fi
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          PY=$(tools/rfoundry_python.sh)
          "$PY" - <<'PY'
          import os, re
          from pathlib import Path
          proof = Path(os.environ["RUNNER_TEMP"]) / "p25-source-proof"
          log = (proof / "full-firmware.log").read_text()
          if re.search(r"^ci: (?:FAIL|warn)\b|^ci: skip .*compiler .*not installed|^ci: skip .*no board built", log, re.M):
              raise SystemExit("official gate warned, failed, or skipped a required compiler/build")
          if "ci: all checks passed" not in log.splitlines():
              raise SystemExit("official firmware gate did not finish")
          rows = []
          for line in Path("build/ci/size-report.md").read_text().splitlines():
              cells = [cell.strip() for cell in line.split("|")]
              if len(cells) > 3 and cells[1] == os.environ["BOARD"] and cells[3].isdigit():
                  rows.append(cells[2])
          if not {"default", "maximal", "fm-minimal"} <= set(rows):
              raise SystemExit("the board's complete default/maximal/fm-minimal rows are missing")
          PY
          cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record and verify final source state
        if: always() && steps.source.outcome == 'success'
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/p25-source-proof/final-head.txt"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/p25-source-proof/final-status.txt"
          test "$(cat "$RUNNER_TEMP/p25-source-proof/final-head.txt")" = "$SOURCE_SHA"
          test ! -s "$RUNNER_TEMP/p25-source-proof/final-status.txt"
      - name: Upload every log, size report and source proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: firmware-${{ inputs.source_sha }}-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p25-source-proof/
            build/ci/*.log
            build/ci/**/*.log
            build/ci/size-report.md
          if-no-files-found: error
